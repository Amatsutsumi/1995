<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✦ 二次元导航 ✦</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #0b0818;
            /* 深邃紫黑底 */
            background-image:
                radial-gradient(ellipse 800px 500px at 10% 0%, rgba(180, 80, 255, 0.15), transparent),
                radial-gradient(ellipse 900px 600px at 90% 100%, rgba(255, 80, 180, 0.12), transparent),
                radial-gradient(ellipse 600px 400px at 50% 50%, rgba(100, 60, 255, 0.06), transparent);
            color: #f0ecff;
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== 飘落花瓣容器 ===== */
        #petals-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            top: -30px;
            width: 18px;
            height: 18px;
            background: radial-gradient(circle at 30% 30%, #ffb7d5, #ff7eb3);
            border-radius: 50% 0 50% 50%;
            opacity: 0.55;
            transform-origin: center;
            animation: fall linear infinite;
            box-shadow: 0 0 12px rgba(255, 130, 200, 0.25);
            will-change: transform;
        }

        .petal::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 4px;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.30);
            border-radius: 50%;
            filter: blur(1px);
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 0.55;
            }
            20% {
                opacity: 0.75;
            }
            80% {
                opacity: 0.60;
            }
            100% {
                transform: translateY(105vh) rotate(720deg) scale(0.6);
                opacity: 0.15;
            }
        }

        /* ===== 星星闪烁 ===== */
        .star {
            position: fixed;
            border-radius: 50%;
            background: white;
            pointer-events: none;
            z-index: 0;
            animation: twinkle ease-in-out infinite alternate;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        @keyframes twinkle {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            100% {
                opacity: 0.9;
                transform: scale(1.2);
            }
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 24px 56px;
        }

        /* ===== 顶部标题 ===== */
        header {
            text-align: center;
            margin-bottom: 48px;
            position: relative;
        }

        header .title-deco {
            display: inline-block;
            font-size: 2.0rem;
            letter-spacing: 6px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ff9bc0, #c084fc, #8ab4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px rgba(192, 132, 252, 0.25);
            font-weight: 700;
        }

        header h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffb3d1, #d4a0ff, #8cc4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 80px rgba(180, 100, 255, 0.20);
            position: relative;
        }

        header h1::before {
            content: "✦";
            margin-right: 16px;
            -webkit-text-fill-color: initial;
            color: #ff9bc0;
            font-size: 2.0rem;
            text-shadow: 0 0 30px #ff7eb3;
        }

        header h1::after {
            content: "✦";
            margin-left: 16px;
            -webkit-text-fill-color: initial;
            color: #8ab4ff;
            font-size: 2.0rem;
            text-shadow: 0 0 30px #6a9eff;
        }

        header .subtitle {
            font-size: 1.05rem;
            color: #b8b0e8;
            letter-spacing: 8px;
            background: rgba(255, 255, 255, 0.04);
            display: inline-block;
            padding: 6px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            margin-top: 4px;
        }

        header .subtitle span {
            display: inline-block;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%,
            100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
        }

        /* ===== 音乐状态提示 ===== */
        .music-hint {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #a89fd6;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 6px 20px;
            border-radius: 40px;
            display: inline-block;
            transition: all 0.3s;
            cursor: default;
            letter-spacing: 1px;
        }

        .music-hint .icon {
            display: inline-block;
            margin-right: 8px;
            font-size: 1.0rem;
            animation: pulse-icon 2s ease-in-out infinite;
        }

        @keyframes pulse-icon {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .music-hint.playing .icon {
            animation: none;
            color: #ff9bc0;
        }

        .music-hint.playing .icon::after {
            content: " ♪";
            animation: music-note 1.2s ease-in-out infinite;
        }

        @keyframes music-note {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        /* ===== 分区标题 ===== */
        .section {
            margin-bottom: 40px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #d4ccff;
            letter-spacing: 2px;
        }

        .section-header::before {
            content: "";
            width: 6px;
            height: 22px;
            background: linear-gradient(180deg, #ff9bc0, #c084fc);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.3);
        }

        .section-header .deco {
            font-size: 1.1rem;
            opacity: 0.6;
        }

        /* ===== 卡片网格 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 22px;
        }

        /* ===== 卡片 ===== */
        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            padding: 24px 22px 22px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.4s ease,
                border-color 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 155, 192, 0.2), rgba(192, 132, 252, 0.1), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: opacity 0.4s;
        }

        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 20px;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 155, 192, 0.06), transparent 70%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: rgba(255, 155, 192, 0.25);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(192, 132, 252, 0.06);
        }

        .card:hover::after {
            opacity: 1;
        }

        .card .card-icon {
            font-size: 2.0rem;
            margin-bottom: 8px;
            display: block;
            filter: drop-shadow(0 0 12px rgba(255, 155, 192, 0.2));
        }

        .card h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #f0ecff, #d4ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card p {
            font-size: 0.88rem;
            color: #a89fd6;
            line-height: 1.5;
            -webkit-text-fill-color: #a89fd6;
        }

        .card .card-tag {
            display: inline-block;
            margin-top: 12px;
            font-size: 0.7rem;
            padding: 3px 14px;
            border-radius: 20px;
            background: rgba(255, 155, 192, 0.10);
            border: 1px solid rgba(255, 155, 192, 0.10);
            color: #c4b8ff;
            letter-spacing: 1px;
            -webkit-text-fill-color: #c4b8ff;
            backdrop-filter: blur(4px);
        }

        .card .glow-ring {
            position: absolute;
            top: -40%;
            right: -20%;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(192, 132, 252, 0.06), transparent 70%);
            pointer-events: none;
            transition: transform 0.6s;
        }

        .card:hover .glow-ring {
            transform: scale(1.3);
        }

        /* ===== 占位卡片（灰色） ===== */
        .card.placeholder {
            opacity: 0.5;
            cursor: default;
            filter: grayscale(0.4);
        }

        .card.placeholder:hover {
            transform: none;
            border-color: rgba(255, 255, 255, 0.05);
            box-shadow: none;
        }

        .card.placeholder .card-tag {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.04);
            color: #6a6490;
        }

        /* ===== 底部 ===== */
        footer {
            margin-top: 56px;
            padding-top: 28px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            color: #6a6490;
        }

        footer .footer-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        footer .footer-left .heart {
            color: #ff7eb3;
            animation: heartbeat 1.6s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes heartbeat {
            0%,
            100% {
                transform: scale(1);
            }
            14% {
                transform: scale(1.2);
            }
            28% {
                transform: scale(1);
            }
            42% {
                transform: scale(1.15);
            }
            56% {
                transform: scale(1);
            }
        }

        footer a {
            color: #8ab4ff;
            transition: color 0.3s;
        }

        footer a:hover {
            color: #ff9bc0;
        }

        /* ===== 音乐控制按钮（悬浮） ===== */
        .music-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 99;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.10);
            background: rgba(20, 16, 40, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #d4ccff;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.35s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .music-toggle:hover {
            transform: scale(1.08);
            border-color: rgba(255, 155, 192, 0.25);
            box-shadow: 0 8px 40px rgba(192, 132, 252, 0.15);
            color: #ff9bc0;
        }

        .music-toggle .status-dot {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4a8f6b;
            border: 2px solid rgba(20, 16, 40, 0.8);
            transition: background 0.3s;
        }

        .music-toggle.paused .status-dot {
            background: #7a6a8a;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
                letter-spacing: 2px;
            }
            header h1::before,
            header h1::after {
                font-size: 1.4rem;
                margin: 0 8px;
            }
            header .title-deco {
                font-size: 1.4rem;
                letter-spacing: 3px;
            }
            header .subtitle {
                font-size: 0.85rem;
                letter-spacing: 4px;
                padding: 4px 16px;
            }
            .container {
                padding: 24px 14px 48px;
            }
            .grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .music-toggle {
                width: 46px;
                height: 46px;
                font-size: 1.2rem;
                bottom: 20px;
                right: 20px;
            }
            footer {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
        }

        @media (max-width: 400px) {
            header h1 {
                font-size: 1.5rem;
            }
            .card {
                padding: 18px 16px;
            }
        }

        /* ===== 入场渐显 ===== */
        .container {
            animation: fadeUp 1.2s ease both;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(28px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 自定义滚动条 ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 155, 192, 0.25);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 155, 192, 0.4);
        }
    </style>
</head>

    <!-- ===== 悬浮音乐按钮 ===== -->
    <button class="music-toggle paused" id="musicToggle" aria-label="音乐控制">
        <span id="musicIcon">🔇</span>
        <span class="status-dot" id="statusDot"></span>
    </button>

    <script>
        // ============================================================
        //  1. 飘落花瓣
        // ============================================================
        (function createPetals() {
            const container = document.getElementById('petals-container');
            const count = 45;
            for (let i = 0; i < count; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                const size = 12 + Math.random() * 16;
                petal.style.width = size + 'px';
                petal.style.height = size + 'px';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.animationDuration = (8 + Math.random() * 14) + 's';
                petal.style.animationDelay = (Math.random() * 16) + 's';
                petal.style.opacity = 0.3 + Math.random() * 0.4;
                petal.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
                // 随机粉色变化
                const hue = 330 + Math.random() * 20;
                petal.style.background = 'radial-gradient(circle at 30% 30%, hsl(' + hue + ', 90%, 80%), hsl(' + hue +
                    ', 80%, 65%))';
                container.appendChild(petal);
            }
        })();

        // ============================================================
        //  2. 星星
        // ============================================================
        (function createStars() {
            const container = document.getElementById('stars-container');
            const count = 60;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = 1.5 + Math.random() * 3;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDuration = (2 + Math.random() * 4) + 's';
                star.style.animationDelay = (Math.random() * 5) + 's';
                star.style.opacity = 0.2 + Math.random() * 0.4;
                container.appendChild(star);
            }
        })();

        // ============================================================
        //  3. BGM 控制
        // ============================================================
        (function musicController() {
            const audio = new Audio('./bgm/bgm01.mp3');
            audio.loop = true;
            audio.volume = 0.6;

            let isPlaying = false;
            let hasInteracted = false;

            const hint = document.getElementById('musicHint');
            const toggleBtn = document.getElementById('musicToggle');
            const iconSpan = document.getElementById('musicIcon');
            const dot = document.getElementById('statusDot');

            function updateUI(playing) {
                if (playing) {
                    hint.classList.add('playing');
                    hint.querySelector('.hint-text').textContent = '♪ BGM 播放中';
                    toggleBtn.classList.remove('paused');
                    iconSpan.textContent = '🔊';
                    dot.style.background = '#6fcf97';
                } else {
                    hint.classList.remove('playing');
                    hint.querySelector('.hint-text').textContent = '⏸ BGM 已暂停';
                    toggleBtn.classList.add('paused');
                    iconSpan.textContent = '🔇';
                    dot.style.background = '#7a6a8a';
                }
            }

            function playMusic() {
                if (isPlaying) return;
                audio.play().then(() => {
                    isPlaying = true;
                    hasInteracted = true;
                    updateUI(true);
                }).catch(err => {
                    // 自动播放被阻止，等待用户交互
                    console.log('等待用户交互后播放');
                });
            }

            function pauseMusic() {
                if (!isPlaying) return;
                audio.pause();
                isPlaying = false;
                updateUI(false);
            }

            function toggleMusic() {
                if (isPlaying) {
                    pauseMusic();
                } else {
                    playMusic();
                }
            }

            // ---- 用户交互触发 ----
            function handleInteraction() {
                if (!hasInteracted) {
                    playMusic();
                }
            }

            // 点击页面任意位置
            document.addEventListener('click', handleInteraction, { passive: true });
            // 滚动触发
            document.addEventListener('scroll', handleInteraction, { passive: true });
            // 触摸（移动端）
            document.addEventListener('touchstart', handleInteraction, { passive: true });

            // ---- 按钮点击 ----
            toggleBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleMusic();
            });

            // ---- 页面可见性变化时恢复 ----
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden && isPlaying) {
                    audio.play().catch(() => {});
                }
            });

            // ---- 初始 UI ----
            updateUI(false);

            // 如果用户快速交互，确保能播放
            // 额外：页面加载后如果用户已经交互过，但audio还没准备好，重试
            setTimeout(() => {
                if (hasInteracted && !isPlaying) {
                    playMusic();
                }
            }, 1000);

            // 暴露给调试
            window.__bgm = { audio, play: playMusic, pause: pauseMusic, toggle: toggleMusic };

            console.log('🎵 BGM 加载完成，等待用户交互后播放');
        })();
    </script>

</body>
</html>
