<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live2D 看板娘</title>
    <style>
        /* 简单重置 */
        * {
            margin: 0;
            padding: 0;
        }
        body {
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, sans-serif;
        }
        .card {
            background: white;
            padding: 40px 60px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a2e;
        }
        p {
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎀 看板娘测试页</h1>
        <p>页面右下角应该出现模型，点击左侧 💬 可聊天</p>
        <p style="font-size:14px; color:#999; margin-top:12px;">模型：约战 · 狂三</p>
    </div>

    <!-- ========== 引入看板娘 ========== -->

    <!-- 1. l2d 渲染库 -->
    <script src="https://unpkg.com/l2d/dist/index.min.js">
    </script>

    <!-- 2. 插件样式 -->
    <link rel="stylesheet" href="https://yinghu.asia/live2d-plugin/l2d-waifu.css" />

    <!-- 3. 插件主逻辑（配置在 config.js 中） -->
    <script src="https://api.yinghu.asia/watcher/config.js">
    </script>
    <script src="https://yinghu.asia/live2d-plugin/l2d-waifu.js">
    </script>

</body>
</html>
